<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réinitialisation — NG-MADA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #0a0f1a 0%, #0f172a 50%, #1a1f3a 100%);
    }
    .reset-box {
      max-width: 400px;
      width: 100%;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(250,204,21,0.1);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }
    .reset-box h1 {
      color: #f1f5f9;
      font-size: 22px;
      text-align: center;
      margin-bottom: 8px;
    }
    .reset-box .sub {
      color: #94a3b8;
      text-align: center;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .reset-box .sub .accent {
      color: #facc15;
      font-weight: 700;
    }
    .reset-box .status {
      text-align: center;
      font-size: 14px;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .reset-box .status.loading { color: #94a3b8; }
    .reset-box .status.ok { color: #4ade80; background: rgba(74,222,128,0.08); }
    .reset-box .status.err { color: #f87171; background: rgba(248,113,113,0.08); }
    .reset-box label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin: 14px 0 6px;
    }
    .reset-box input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f1f5f9;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    .reset-box input:focus {
      outline: none;
      border-color: #facc15;
      box-shadow: 0 0 0 3px rgba(250,204,21,0.1);
    }
    .reset-box .btn-primary {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: none;
      border-radius: 9px;
      background: #facc15;
      color: #0f172a;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .reset-box .btn-primary:hover {
      background: #f59e0b;
      transform: translateY(-1px);
    }
    .reset-box .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .reset-box .msg {
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      padding: 8px 12px;
      border-radius: 8px;
      min-height: 36px;
    }
    .reset-box .msg.ok {
      background: rgba(74,222,128,0.08);
      color: #86efac;
    }
    .reset-box .msg.err {
      background: rgba(248,113,113,0.08);
      color: #fca5a5;
    }
    .reset-box .footer {
      text-align: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.04);
      font-size: 10px;
      color: rgba(255,255,255,0.15);
      letter-spacing: 0.5px;
    }
    .reset-box .footer .gold {
      color: #facc15;
    }
    .reset-box .back-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      color: #94a3b8;
      font-size: 13px;
      text-decoration: none;
      transition: color 0.3s;
    }
    .reset-box .back-link:hover {
      color: #facc15;
    }
  </style>
</head>
<body>
  <div class="reset-box">
    <h1>🔑 Nouveau mot de passe</h1>
    <p class="sub">Saisissez votre nouveau mot de passe pour le compte <span class="accent">NG-MADA</span></p>
    
    <div id="statusMessage" class="status loading">⏳ Vérification du lien en cours...</div>
    
    <form id="frmResetPassword" style="display:none;">
      <label for="newPassword">📝 Nouveau mot de passe (6 caractères minimum)</label>
      <input type="password" id="newPassword" placeholder="••••••••" required minlength="6" autocomplete="new-password">
      
      <label for="confirmPassword">✅ Confirmer le mot de passe</label>
      <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="6" autocomplete="new-password">
      
      <button type="submit" class="btn-primary" id="btnResetPassword">🔄 Réinitialiser</button>
      <div class="msg" id="resetMsg"></div>
    </form>
    
    <a href="#" class="back-link" onclick="retournerConnexion(); return false;">← Retourner à la connexion</a>
    
    <div class="footer">
      <span class="gold">NEXT GENERATION MADA</span> — "NG-MADA"<br>
      By Zaïd Harith
    </div>
  </div>
  
  <script>
    // ============================================================
    //  RÉINITIALISATION MOT DE PASSE - AVEC GESTION D'ERREUR
    // ============================================================
    
    (function() {
      console.log('🔐 Page de réinitialisation chargée');
      
      // Récupérer le token depuis l'URL
      var urlParams = new URLSearchParams(window.location.search);
      var token = urlParams.get('reset');
      
      // Si le token est passé via le template (<?!= token ?>), l'utiliser
      if (!token) {
        try { token = <?!= token ? JSON.stringify(token) : 'null' ?>; } catch(e) {}
      }
      
      var statusMsg = document.getElementById('statusMessage');
      var form = document.getElementById('frmResetPassword');
      var btn = document.getElementById('btnResetPassword');
      var msg = document.getElementById('resetMsg');
      
      console.log('🔑 Token détecté:', token);
      
      // Fonction pour obtenir l'URL de base
      function getBaseUrl() {
        var url = window.location.href;
        var index = url.indexOf('?');
        if (index !== -1) {
          url = url.substring(0, index);
        }
        return url;
      }
      
      // Fonction pour retourner à la connexion
      window.retournerConnexion = function() {
        window.location.href = getBaseUrl();
      };
      
      // Fonction pour afficher un message
      function setStatus(message, type) {
        statusMsg.textContent = message;
        statusMsg.className = 'status ' + type;
        console.log('📢 Status:', type, message);
      }
      
      // Fonction pour afficher un message dans le formulaire
      function setFormMessage(message, type) {
        msg.textContent = message;
        msg.className = 'msg ' + type;
      }
      
      // Vérifier le token
      function verifierToken() {
        if (!token) {
          setStatus('❌ Token de réinitialisation manquant.', 'err');
          form.style.display = 'none';
          return;
        }
        
        setStatus('⏳ Vérification du token...', 'loading');
        
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(function(res) {
              console.log('✅ Réponse verifierToken:', res);
              if (res && res.success) {
                setStatus('✅ Réinitialisation pour : ' + res.email, 'ok');
                form.style.display = 'block';
                form.dataset.token = token;
                btn.disabled = false;
              } else {
                setStatus('❌ ' + ((res && res.message) || 'Lien invalide ou expiré.'), 'err');
                form.style.display = 'none';
              }
            })
            .withFailureHandler(function(err) {
              console.error('❌ Erreur verifierToken:', err);
              setStatus('❌ Erreur : ' + err.message, 'err');
              form.style.display = 'none';
            })
            .verifierTokenReinitialisation(token);
        } else {
          // Mode démo
          setStatus('⚠️ Mode démo - Vérification simulée', 'ok');
          form.style.display = 'block';
          form.dataset.token = token || 'demo_token';
          btn.disabled = false;
        }
      }
      
      // Soumettre le formulaire
      document.getElementById('frmResetPassword').addEventListener('submit', function(e) {
        e.preventDefault();
        
        var token = this.dataset.token;
        var nouveau = document.getElementById('newPassword').value;
        var confirmer = document.getElementById('confirmPassword').value;
        
        console.log('🔑 Soumission - Token:', token);
        
        if (nouveau.length < 6) {
          setFormMessage('❌ Le mot de passe doit contenir au moins 6 caractères.', 'err');
          return;
        }
        
        if (nouveau !== confirmer) {
          setFormMessage('❌ Les mots de passe ne correspondent pas.', 'err');
          return;
        }
        
        btn.disabled = true;
        btn.textContent = '⏳ Réinitialisation en cours...';
        setFormMessage('', '');
        
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(function(res) {
              console.log('✅ Réponse reinitialiserMotDePasse:', res);
              btn.disabled = false;
              btn.textContent = '🔄 Réinitialiser';
              
              if (res && res.success) {
                setFormMessage('✅ ' + res.message + ' Vous pouvez maintenant vous connecter.', 'ok');
                // Rediriger vers la page de connexion avec un paramètre de succès
                var baseUrl = getBaseUrl();
                setTimeout(function() {
                  console.log('🚀 Redirection vers:', baseUrl + '?reset_success=true');
                  window.location.href = baseUrl + '?reset_success=true';
                }, 2000);
              } else {
                setFormMessage('❌ ' + ((res && res.message) || 'Erreur inconnue'), 'err');
              }
            })
            .withFailureHandler(function(err) {
              console.error('❌ Erreur reinitialiserMotDePasse:', err);
              btn.disabled = false;
              btn.textContent = '🔄 Réinitialiser';
              setFormMessage('❌ Erreur : ' + err.message, 'err');
            })
            .reinitialiserMotDePasse(token, nouveau);
        } else {
          // Mode démo
          btn.disabled = false;
          btn.textContent = '🔄 Réinitialiser';
          setFormMessage('✅ Réinitialisation simulée (mode démo)', 'ok');
          setTimeout(function() {
            window.location.href = getBaseUrl() + '?reset_success=true';
          }, 2000);
        }
      });
      
      // Lancer la vérification
      verifierToken();
      
    })();
  </script>
</body>
</html>
