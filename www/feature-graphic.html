<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 600px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #f1f5f9;
    }
    .logo {
      font-size: 72px;
      font-weight: 900;
      color: #facc15;
      letter-spacing: 4px;
    }
    .sub {
      font-size: 28px;
      color: #94a3b8;
      margin-top: 10px;
    }
    .badge {
      margin-top: 30px;
      padding: 10px 30px;
      border: 2px solid #facc15;
      border-radius: 30px;
      font-size: 18px;
      color: #facc15;
      letter-spacing: 2px;
    }
    .icon { font-size: 80px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="icon">💼</div>
  <div class="logo">NG-MADA</div>
  <div class="sub">Gestion des apports, caisse et membres</div>
  <div class="badge">NEXT GENERATION MADA</div>
</body>
</html>
